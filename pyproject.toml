[project]
name = "localkit"
version = "0.3.0"
description = "LocalKit: hardware-aware local AI runtime and resolver across consumer devices"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "packaging>=24",
  "cryptography>=45,<51",
  "jsonschema>=4.23,<5",
  "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
executorch = ["executorch==1.5.1", "torch==2.14.0", "tokenizers>=0.23,<0.24"]
litert = ["ai-edge-litert==2.3.0", "litert-lm-api==0.18.0"]
export = ["safetensors>=0.7,<1", "torchvision>=0.29,<0.30"]
vision = ["transformers==5.20.1", "torchvision>=0.29,<0.30", "num2words>=0.5.14,<0.6"]
mlx = ["mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
localkit = "phaseone.runtime.cli:main"
phaseone-runtime = "phaseone.runtime.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phaseone", "localkit"]

# Qualcomm/Linux hosts need the CPU PyTorch dependency, not PyPI's CUDA bundle.
# ExecuTorch still selects its own delegates independently of this dependency.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
